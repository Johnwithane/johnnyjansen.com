name: Site (check + deploy)

# One Firebase Hosting site: the static portfolio (repo root) + the portal at
# /app, assembled into dist/ by scripts/build-site.mjs. Lint, build and test on
# every push and PR; deploy hosting + functions + rules on main. Deploys are
# skipped until FIREBASE_DEPLOY_ENABLED and FIREBASE_SERVICE_ACCOUNT exist
# (HUMANTASKS.md). Until DNS moves, GitHub Pages still serves the root too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: portal-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root deps (emulator + rules tests)
        run: npm ci
      - name: Install portal deps
        run: npm ci --prefix portal
      - name: Install functions deps
        run: npm ci --prefix functions
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - name: Test
        run: npm run test:run
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Firestore rules tests
        run: npm run test:rules
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && vars.FIREBASE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Install functions deps
        run: npm ci --prefix functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy rules + indexes + storage
        run: npx firebase-tools@15 deploy --only firestore:rules,firestore:indexes,storage --project familyhub-prod --non-interactive
      - name: Deploy functions
        run: npx firebase-tools@15 deploy --only functions --project familyhub-prod --non-interactive --force
      - name: Deploy hosting
        id: deploy_hosting
        run: npx firebase-tools@15 deploy --only hosting --project familyhub-prod --non-interactive

      # Feedback loop, last step: any Feedback-Id trailer in the pushed commits
      # marks that report shipped, which is what tells the reporter it is live.
      - name: Mark feedback shipped
        if: ${{ !cancelled() && steps.deploy_hosting.outcome == 'success' && github.event_name == 'push' }}
        env:
          CI_FEEDBACK_TOKEN: ${{ secrets.CI_FEEDBACK_TOKEN }}
        run: |
          if [ -z "$CI_FEEDBACK_TOKEN" ]; then echo "CI_FEEDBACK_TOKEN not set; skipping"; exit 0; fi
          IDS=$(git log --format=%B ${{ github.event.before }}..${{ github.sha }} | grep -E '^Feedback-Id:' | sed -E 's/^Feedback-Id:[[:space:]]*//' | sort -u | tr -d '\r')
          if [ -z "$IDS" ]; then echo "no Feedback-Id trailers"; exit 0; fi
          BODY=$(printf '%s\n' "$IDS" | node -e 'const ids=require("fs").readFileSync(0,"utf8").split("\n").filter(Boolean);process.stdout.write(JSON.stringify({reportIds:ids,version:process.argv[1]}))' "${GITHUB_SHA::7}")
          curl -sS -f -X POST -H "Content-Type: application/json" -H "x-ci-token: $CI_FEEDBACK_TOKEN" \
            --data "$BODY" https://us-central1-familyhub-prod.cloudfunctions.net/markFeedbackShipped || echo "::warning::markFeedbackShipped failed; reports stay open"

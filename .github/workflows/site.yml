name: Site (hosting)

# The portfolio site project (johnnyjansen-site) serves the portfolio and every
# incubated app's client at its mountPath. This builds all of them and deploys
# hosting on main. Each app's functions and rules deploy from its own
# app-<slug>.yml to its own project.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: site-hosting
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Incubator invariants
        run: node scripts/incubate.mjs check
      - name: Install family-hub app deps
        run: npm ci --prefix apps/family-hub/app
      - name: Build site
        run: node scripts/build-site.mjs
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FAMILY_HUB_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FAMILY_HUB_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FAMILY_HUB_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FAMILY_HUB_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.FAMILY_HUB_RECAPTCHA_SITE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.FIREBASE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_SITE }}
      - name: Deploy hosting
        run: npx firebase-tools@15 deploy --only hosting --project johnnyjansen-site --non-interactive
